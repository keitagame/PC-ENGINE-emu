<!doctype html>

  <body>
    <header>
      <h1>PC-ENGINE</h1>
      <label class="file-label">
        Select
        <input id="rom" type="file" class="file-input" />
      </label>
      <span id="file-name"></span>
      <button id="fullscreenBtn">Fullscreen</button>
      <button id="start">Start</button>
      <div class="mono" id="status">No ROM</div>

        <span class="mono">CPU PC:</span>

    <div class="row">
      <canvas id="screen" width="256" height="240"></canvas>
      <div style="display: none">
        <div><b>FPS:</b> <span id="fps">0</span></div>
        <div><b>Cycles:</b> <span id="cyc" class="mono">0</span></div>
      </div>
    </div>

    <script>
      "use strict";

      function h8(v) {
        return (v & 0xff).toString(16).padStart(2, "0");
      }
      function h16(v) {
        return (v & 0xffff).toString(16).padStart(4, "0");
      }

      // ════════════════════════════════════════════════════════
      // ROM LOADER
      // ════════════════════════════════════════════════════════
      function loadPCE(buf) {
        let d = new Uint8Array(buf);
if (d.length % 0x2000 === 512) {
    console.log("Header detected → stripping 512 bytes");
    return d.slice(512);
  }
        //if ((d.length & 0x1fff) === 0x200) d = d.slice(0x200);
        return d;
      }

      // ════════════════════════════════════════════════════════
      // VCE  (HuC6260)  — 9-bit color encoder
      // Color format stored as bits: GGGRRRBBx  (stored in 9 bits)
      // bit8-6=G, bit5-3=R, bit2-0=B
      // ════════════════════════════════════════════════════════
      class VCE {
        constructor() {
          this.ctrl = 0;
          this.addr = 0;
          this.raw = new Uint16Array(512);
          this.pal = new Uint32Array(512);
          for (let i = 0; i < 512; i++) this.pal[i] = 0xff000000;
        }
        _expand(i) {
          const v = this.raw[i] & 0x1ff;
          const g = ((v >> 6) & 7) * 36;
          const r = ((v >> 3) & 7) * 36;
          const b = (v & 7) * 36;
          this.pal[i] = 0xff000000 | (r << 16) | (g << 8) | b;
        }
        write(reg, val) {
          switch (reg & 7) {
            case 0:
              this.ctrl = val;
              break;
            case 2:
              this.addr = (this.addr & 0x100) | val;
              break;
            case 3:
              this.addr = (this.addr & 0x0ff) | ((val & 1) << 8);
              break;
            case 4:
              this.raw[this.addr] =
                (this.raw[this.addr] & 0x1e0) | (val & 0x1f);
              break;
            case 5:
              this.raw[this.addr] =
                (this.raw[this.addr] & 0x01f) | ((val & 0x0f) << 5);
              this._expand(this.addr);
              this.addr = (this.addr + 1) & 0x1ff;
              break;
          }
        }
        read(reg) {
          if ((reg & 7) === 4) return this.raw[this.addr] & 0x1f;
          if ((reg & 7) === 5) return (this.raw[this.addr] >> 5) & 0x0f;
          return 0;
        }
      }

      // ════════════════════════════════════════════════════════
      // VDC  (HuC6270)  — video display controller
      // ════════════════════════════════════════════════════════
      class VDC {
        constructor(vce) {
          this.vce = vce;
          this.vram = new Uint16Array(0x8000); // 64KB VRAM word-addressed
          this.sat = new Uint16Array(64 * 4); // sprite attribute table

          this.ar = 0;
          this.reg = new Uint16Array(32);
          this.stat = 0;

          this.mawr = 0;
          this.marr = 0;
          this.rdBuf = 0;
          this.inc = 1;

          this.scanline = 0;
          this.hclk = 0;
          this.irq = false;

          this.out = new Uint32Array(256 * 240);
        }

        writeAR(v) {
          this.ar = v & 0x1f;
        }

        writeLo(v) {
          this.reg[this.ar] = (this.reg[this.ar] & 0xff00) | (v & 0xff);
          if (this.ar === 0x01) {
            // MARR latch on any write (lo first)
            // will finalize on hi write
          }
        }
        writeHi(v) {
          this.reg[this.ar] = (this.reg[this.ar] & 0x00ff) | ((v & 0xff) << 8);
          const r = this.ar;
          if (r === 0x00) {
            this.mawr = this.reg[0x00];
          } else if (r === 0x01) {
            this.marr = this.reg[0x01];
            this.rdBuf = this.vram[this.marr & 0x7fff];
            this.marr = (this.marr + this.inc) & 0xffff;
          } else if (r === 0x02) {
            // VWR
            this.vram[this.mawr & 0x7fff] = this.reg[0x02];
            this.mawr = (this.mawr + this.inc) & 0xffff;
          } else if (r === 0x05) {
            // CR
            const iv = (this.reg[0x05] >> 11) & 3;
            this.inc = [1, 32, 64, 128][iv];
          } else if (r === 0x13) {
            // LENR → trigger VRAM-DMA
            this._vramDMA();
          }
        }

        _vramDMA() {
          let src = this.reg[0x15] & 0x7fff;
          let dst = this.reg[0x16] & 0x7fff;
          let len = (this.reg[0x13] & 0xffff) + 1;
          const c = this.reg[0x12];
          const si = c & 4 ? -1 : 1;
          const di = c & 8 ? -1 : 1;
          while (len--) {
            this.vram[dst & 0x7fff] = this.vram[src & 0x7fff];
            src = (src + si) & 0xffff;
            dst = (dst + di) & 0xffff;
          }
          if (this.reg[0x05] & 0x80) {
            this.stat |= 0x10;
            this.irq = true;
          }
        }

        _satDMA() {
          const base = this.reg[0x0f] & 0x7fff;
          for (let i = 0; i < 256; i++)
            this.sat[i] = this.vram[(base + i) & 0x7fff];
          if (this.reg[0x05] & 0x01) {
            this.stat |= 0x10;
            this.irq = true;
          }
        }

        readStat() {
          const s = this.stat;
          this.stat = 0;
          this.irq = false;
          return s;
        }
        readLo() {
          return this.rdBuf & 0xff;
        }
        readHi() {
          const v = (this.rdBuf >> 8) & 0xff;
          this.rdBuf = this.vram[this.marr & 0x7fff];
          this.marr = (this.marr + this.inc) & 0xffff;
          return v;
        }

        // ── scanline rendering ──────────────────────────────────
        _renderLine(sl) {
          if (sl < 0 || sl >= 240) return;
          const cr = this.reg[0x05];
          const bgOn = (cr & 0x80) !== 0;
          const sprOn = (cr & 0x40) !== 0;

          const bxr = this.reg[0x07] & 0x03ff;
          const byr = this.reg[0x08] & 0x01ff;
          const mwrReg = (this.reg[0x09] >> 4) & 3;
          const mapW = [32, 64, 128, 128][mwrReg];
          const mapH = 32;
          const base = sl * 256;

          if (bgOn) {
            const ty = Math.floor(((sl + byr) & 0xff) / 8) % mapH;
            const pyIn = (sl + byr) & 7;
            for (let x = 0; x < 256; x++) {
              const tx = Math.floor(((x + bxr) & 0x3ff) / 8) % mapW;
              const pxIn = (x + bxr) & 7;
              const bat = this.vram[(ty * mapW + tx) & 0x7fff];
              const tile = bat & 0x07ff;
              const pal = (bat >> 12) & 0x0f;
              // PCE tile: 16 words, words 0-7 = planes 0/1, words 8-15 = planes 2/3
              // Each word: lo byte = plane 0 (or 2), hi byte = plane 1 (or 3)
              // bit 7 = leftmost pixel
              const tw01 = this.vram[(tile * 16 + pyIn) & 0x7fff];
              const tw23 = this.vram[(tile * 16 + pyIn + 8) & 0x7fff];
              const bit = 7 - pxIn;
              const c0 = (tw01 >> bit) & 1;
              const c1 = (tw01 >> (bit + 8)) & 1;
              const c2 = (tw23 >> bit) & 1;
              const c3 = (tw23 >> (bit + 8)) & 1;
              const ci = c0 | (c1 << 1) | (c2 << 2) | (c3 << 3);
              const vi = ci === 0 ? pal * 16 : pal * 16 + ci;
              this.out[base + x] = this.vce.pal[vi & 0x1ff];
            }
          } else {
            const bg = this.vce.pal[0];
            for (let x = 0; x < 256; x++) this.out[base + x] = bg;
          }

          if (sprOn) {
            let drawn = 0;
            for (let s = 0; s < 64; s++) {
              // sprite 0 = highest priority
              const sy = (this.sat[s * 4 + 0] & 0x03ff) - 64;
              const sx = (this.sat[s * 4 + 1] & 0x03ff) - 32;
              const pat = this.sat[s * 4 + 2];
              const ctrl = this.sat[s * 4 + 3];
              const palN = (ctrl & 0x000f) + 16;
              const flipH = (ctrl & 0x0800) !== 0;
              const flipV = (ctrl & 0x8000) !== 0;
              const tall = (ctrl & 0x0100) !== 0;
              const sprH = tall ? 32 : 16;
              const row = sl - sy;
              if (row < 0 || row >= sprH) continue;
              if (sx + 16 <= 0 || sx >= 256) continue;

              const pr = flipV ? sprH - 1 - row : row;
              // Pattern address: pat bits 9-1 give 16x16 tile number, bit 0 ignored
              // For 32-tall: lower half uses pat|1
              let tileNo = (pat >> 1) & 0x1ff;
              if (tall && pr >= 16) tileNo |= 1;
              const tr = pr & 15;

              // Sprite format: 64 words per 16x16, planes stored differently
              // plane0: words 0-15, plane1: words 16-31, plane2: words 32-47, plane3: words 48-63
              const tBase = (tileNo & 0x1ff) * 64;
              const p0w = this.vram[(tBase + tr) & 0x7fff];
              const p1w = this.vram[(tBase + tr + 16) & 0x7fff];
              const p2w = this.vram[(tBase + tr + 32) & 0x7fff];
              const p3w = this.vram[(tBase + tr + 48) & 0x7fff];

              for (let col = 0; col < 16; col++) {
                const px = sx + col;
                if (px < 0 || px >= 256) continue;
                const bit = flipH ? col : 15 - col;
                const c0 = (p0w >> bit) & 1;
                const c1 = (p1w >> bit) & 1;
                const c2 = (p2w >> bit) & 1;
                const c3 = (p3w >> bit) & 1;
                const ci = c0 | (c1 << 1) | (c2 << 2) | (c3 << 3);
                if (ci === 0) continue;
                this.out[base + px] = this.vce.pal[(palN * 16 + ci) & 0x1ff];
              }
              if (++drawn >= 16) break;
            }
          }
        }

        tick(cyc) {
          const CPL = 341; // ~341 CPU cycles per scanline
          this.hclk += cyc;
          let irqFire = 0;
          while (this.hclk >= CPL) {
            this.hclk -= CPL;
            const sl = this.scanline;
            if (sl >= 0 && sl < 240) {
              this._renderLine(sl);
              // RCR
              const rcr = this.reg[0x0c] & 0x03ff;
              if (this.reg[0x05] & 0x04 && sl === rcr - 64) {
                this.stat |= 0x04;
                irqFire |= 1;
              }
            }
            if (sl === 240) {
              this.stat |= 0x20;
              if (this.reg[0x05] & 0x08) irqFire |= 1;
              if (this.reg[0x05] & 0x10) this._satDMA();
            }
            this.scanline = (this.scanline + 1) % 263;
          }
          if (irqFire) this.irq = true;
          return irqFire;
        }

        flush(imgData) {
          const d = imgData.data;
          for (let i = 0; i < 256 * 240; i++) {
            const c = this.out[i];
            const p = i * 4;
            d[p] = (c >> 16) & 0xff;
            d[p + 1] = (c >> 8) & 0xff;
            d[p + 2] = c & 0xff;
            d[p + 3] = 0xff;
          }
        }
      }

      // ════════════════════════════════════════════════════════
      // PSG  (6-channel wavetable synthesizer)
      // ════════════════════════════════════════════════════════
      class PSG {
        constructor() {
          this.chSel = 0;
          this.mainVol = 0xff;
          this.lfoFreq = 0;
          this.lfoCtrl = 0;
          this.ch = Array.from({ length: 6 }, () => ({
            freq: 0,
            ctrl: 0,
            vol: 0x1f,
            pan: 0xff,
            wave: new Uint8Array(32),
            wptr: 0,
            dda: false,
            ddaVal: 0,
            noiseEn: false,
            noiseFreq: 0,
          }));
        }
        write(reg, val) {
          const c = this.ch[this.chSel & 5];
          switch (reg & 0x0f) {
            case 0x0:
              this.chSel = val & 7;
              break;
            case 0x1:
              this.mainVol = val;
              break;
            case 0x2:
              c.freq = (c.freq & 0xf00) | val;
              break;
            case 0x3:
              c.freq = (c.freq & 0x0ff) | ((val & 0xf) << 8);
              break;
            case 0x4:
              c.ctrl = val;
              c.dda = !!(val & 0x40);
              if (!(val & 0x80)) c.wptr = 0;
              break;
            case 0x5:
              c.pan = val;
              break;
            case 0x6:
              if (c.dda) c.ddaVal = val & 0x1f;
              else {
                c.wave[c.wptr & 31] = val & 0x1f;
                c.wptr = (c.wptr + 1) & 31;
              }
              break;
            case 0x7:
              c.noiseEn = !!(val & 0x80);
              c.noiseFreq = val & 0x1f;
              break;
            case 0x8:
              this.lfoFreq = val;
              break;
            case 0x9:
              this.lfoCtrl = val;
              break;
          }
        }
      }

      // ════════════════════════════════════════════════════════
      // JOYPAD
      // ════════════════════════════════════════════════════════
      const BTN_I = 0,
        BTN_II = 1,
        BTN_SEL = 2,
        BTN_RUN = 3;
      const BTN_UP = 4,
        BTN_RIGHT = 5,
        BTN_DOWN = 6,
        BTN_LEFT = 7;

      class Joypad {
        constructor() {
          this.sel = 1;
          this.state = 0xff; // all bits 1 = released (active-low)
        }
        write(val) {
          this.sel = (val >> 0) & 1;
        }
        read() {
          // lower nibble active-low
          if (this.sel === 0) {
            // sel=0: directions  (bits 7-4 of state)
            const n = (~this.state >> 4) & 0x0f;
            return (n & 0x0f) | 0xa0;
          } else {
            // sel=1: buttons (bits 3-0)
            const n = ~this.state & 0x0f;
            return (n & 0x0f) | 0xa0;
          }
        }
        press(b) {
          this.state &= ~(1 << b);
        }
        release(b) {
          this.state |= 1 << b;
        }
      }

      // ════════════════════════════════════════════════════════
      // BUS
      // ════════════════════════════════════════════════════════
      class Bus {
        constructor(rom, vdc, vce, psg, joy) {
          this.rom = rom;
          this.vdc = vdc;
          this.vce = vce;
          this.psg = psg;
          this.joy = joy;
          this.ram = new Uint8Array(0x2000);
          this.mpr = new Uint8Array(8);

          this.timerLatch = 0;
          this.timerValue = 0;
          this.timerEnabled = false;
          this.timerDiv = 0;

          this.irqMask = 0x07; // all IRQs disabled
          this.irqStatus = 0x00;
        }

        st0(v) {
          this.vdc.writeAR(v);
        }
        st1(v) {
          this.vdc.writeLo(v);
        }
        st2(v) {
          this.vdc.writeHi(v);
        }

        read(addr) {
          addr &= 0xffff;
          const page = (addr >> 13) & 7;
          const ofs = addr & 0x1fff;
          const bank = this.mpr[page];
          if (bank === 0xff) return this._ior(ofs);
          if (bank === 0xf8) return this.ram[ofs];
          const ra = (bank << 13) | ofs;
          return ra < this.rom.length ? this.rom[ra] : 0xff;
        }

        write(addr, val) {
          addr &= 0xffff;
          val &= 0xff;
          const page = (addr >> 13) & 7;
          const ofs = addr & 0x1fff;
          const bank = this.mpr[page];
          if (bank === 0xff) {
            this._iow(ofs, val);
            return;
          }
          if (bank === 0xf8) {
            this.ram[ofs] = val;
            return;
          }
        }

        _ior(ofs) {
          if (ofs <= 0x03ff) {
            const r = ofs & 3;
            if (r === 0) return this.vdc.readStat();
            if (r === 2) return this.vdc.readLo();
            if (r === 3) return this.vdc.readHi();
            return 0;
          }
          if (ofs <= 0x07ff) return this.vce.read(ofs & 7);
          if (ofs <= 0x0bff) return 0xff;
          if (ofs <= 0x0fff) return this.timerValue & 0x7f;
          if (ofs <= 0x13ff) return this.joy.read();
          if (ofs <= 0x17ff) {
            const r = ofs & 3;
            if (r === 2) return this.irqMask & 0x07;
            if (r === 3) return this.irqStatus & 0x07;
          }
          return 0xff;
        }

        _iow(ofs, v) {
          if (ofs <= 0x03ff) {
            const r = ofs & 3;
            if (r === 0) this.vdc.writeAR(v);
            else if (r === 2) this.vdc.writeLo(v);
            else if (r === 3) this.vdc.writeHi(v);
            return;
          }
          if (ofs <= 0x07ff) {
            this.vce.write(ofs & 7, v);
            return;
          }
          if (ofs <= 0x0bff) {
            this.psg.write(ofs & 0x0f, v);
            return;
          }
          if (ofs <= 0x0fff) {
            if ((ofs & 1) === 0) {
              this.timerLatch = v & 0x7f;
            } else {
              const en = (v & 1) !== 0;
              if (en && !this.timerEnabled) {
                this.timerValue = this.timerLatch;
                this.timerDiv = 0;
              }
              this.timerEnabled = en;
            }
            return;
          }
          if (ofs <= 0x13ff) {
            this.joy.write(v);
            return;
          }
          if (ofs <= 0x17ff) {
            const r = ofs & 3;
            if (r === 2) this.irqMask = v & 0x07;
            if (r === 3) this.irqStatus &= ~0x04; // ack timer IRQ
            return;
          }
        }

        tickTimer(cyc) {
          if (!this.timerEnabled) return;
          this.timerDiv += cyc;
          while (this.timerDiv >= 1024) {
            this.timerDiv -= 1024;
            if (--this.timerValue < 0) {
              this.timerValue = this.timerLatch;
              if (!(this.irqMask & 4)) this.irqStatus |= 4;
            }
          }
        }
      }

      // ════════════════════════════════════════════════════════
      // HuC6280 CPU  — complete 65C02 + HuC extensions
      // ════════════════════════════════════════════════════════
      class CPU {
        constructor(bus) {
          this.bus = bus;
          this.pc = 0;
          this.a = 0;
          this.x = 0;
          this.y = 0;
          this.sp = 0xff;
          this.p = 0x34;
          this.cyc = 0;
          // flag masks
          this.C = 0x01;
          this.Z = 0x02;
          this.I = 0x04;
          this.D = 0x08;
          this.B = 0x10;
          this.T = 0x20;
          this.V = 0x40;
          this.N = 0x80;
        }

        reset() {
console.log("RESET VECTOR:",
  bus.read(0xfffe).toString(16),
  bus.read(0xffff).toString(16)
);
          const lo = this.bus.read(0xfffe);
          const hi = this.bus.read(0xffff);
          this.pc = (hi << 8) | lo;
          this.sp = 0xff;
          this.p = this.I | 0x20;
          this.a = this.x = this.y = 0;
          this.cyc = 0;
        }

        fC() {
          return (this.p & this.C) !== 0;
        }
        fZ() {
          return (this.p & this.Z) !== 0;
        }
        fI() {
          return (this.p & this.I) !== 0;
        }
        fD() {
          return (this.p & this.D) !== 0;
        }
        fV() {
          return (this.p & this.V) !== 0;
        }
        fN() {
          return (this.p & this.N) !== 0;
        }
        sf(f, v) {
          if (v) this.p |= f;
          else this.p &= ~f;
        }
        nz(v) {
          v &= 0xff;
          this.sf(this.Z, v === 0);
          this.sf(this.N, v & 0x80);
          return v;
        }

        rb(a) {
          return this.bus.read(a & 0xffff);
        }
        wb(a, v) {
          this.bus.write(a & 0xffff, v & 0xff);
        }

        // Stack lives at $2100–$21FF (page 1 = RAM bank 0xF8, offset $0100)
        push(v) {
          this.wb(0x2100 | this.sp, v);
          this.sp = (this.sp - 1) & 0xff;
        }
        pop() {
          this.sp = (this.sp + 1) & 0xff;
          return this.rb(0x2100 | this.sp);
        }

        fetch() {
          const v = this.rb(this.pc);
          this.pc = (this.pc + 1) & 0xffff;
          return v;
        }
        fetch16() {
          const lo = this.fetch();
          return lo | (this.fetch() << 8);
        }
        fetchS() {
          const v = this.fetch();
          return v & 0x80 ? v - 0x100 : v;
        }

        // Addressing modes → effective address
        zpR() {
          return this.fetch();
        }
        zpXR() {
          return (this.fetch() + this.x) & 0xff;
        }
        zpYR() {
          return (this.fetch() + this.y) & 0xff;
        }
        absR() {
          return this.fetch16();
        }
        abXR() {
          return (this.fetch16() + this.x) & 0xffff;
        }
        abYR() {
          return (this.fetch16() + this.y) & 0xffff;
        }
        izxR() {
          const b = (this.fetch() + this.x) & 0xff;
          return this.rb(b) | (this.rb((b + 1) & 0xff) << 8);
        }
        izyR() {
          const b = this.fetch();
          return (
            ((this.rb(b) | (this.rb((b + 1) & 0xff) << 8)) + this.y) & 0xffff
          );
        }
        indR() {
          const p = this.fetch16();
          return this.rb(p) | (this.rb((p & 0xff00) | ((p + 1) & 0xff)) << 8);
        }
        inXR() {
          const p = (this.fetch16() + this.x) & 0xffff;
          return this.rb(p) | (this.rb((p + 1) & 0xffff) << 8);
        }

        _adc(v) {
          if (this.fD()) {
            // decimal mode
            let lo = (this.a & 0xf) + (v & 0xf) + (this.fC() ? 1 : 0);
            let hi = (this.a >> 4) + (v >> 4) + (lo > 9 ? 1 : 0);
            this.sf(this.Z, ((this.a + v + (this.fC() ? 1 : 0)) & 0xff) === 0);
            this.sf(this.N, hi & 8);
            this.sf(
              this.V,
              !((this.a ^ v) & 0x80) && (this.a ^ (hi << 4)) & 0x80,
            );
            if (lo > 9) lo += 6;
            if (hi > 9) hi += 6;
            this.sf(this.C, hi > 0xf);
            this.a = ((lo & 0xf) | ((hi & 0xf) << 4)) & 0xff;
          } else {
            const c = this.fC() ? 1 : 0;
            const r = this.a + v + c;
            this.sf(this.C, r > 0xff);
            this.sf(this.V, (~(this.a ^ v) & (this.a ^ r) & 0x80) !== 0);
            this.a = this.nz(r);
          }
          this.sf(this.T, false);
        }
        _sbc(v) {
          this._adc(v ^ 0xff);
        }
        _cmp(reg, v) {
          const r = (reg - v) & 0x1ff;
          this.sf(this.C, r < 0x100);
          this.nz(r & 0xff);
        }
        _asl(v) {
          this.sf(this.C, (v & 0x80) !== 0);
          return this.nz((v << 1) & 0xff);
        }
        _lsr(v) {
          this.sf(this.C, (v & 0x01) !== 0);
          return this.nz((v >> 1) & 0xff);
        }
        _rol(v) {
          const c = this.fC() ? 1 : 0;
          this.sf(this.C, (v & 0x80) !== 0);
          return this.nz(((v << 1) | c) & 0xff);
        }
        _ror(v) {
          const c = this.fC() ? 0x80 : 0;
          this.sf(this.C, (v & 0x01) !== 0);
          return this.nz(((v >> 1) | c) & 0xff);
        }
        _bit(v) {
          this.sf(this.Z, (this.a & v) === 0);
          this.sf(this.N, (v & 0x80) !== 0);
          this.sf(this.V, (v & 0x40) !== 0);
        }

        _irq(vec) {
          this.push((this.pc >> 8) & 0xff);
          this.push(this.pc & 0xff);
          this.push(this.p & ~this.B & ~this.T);
          this.sf(this.I, true);
          this.sf(this.T, false);
          this.pc = this.rb(vec) | (this.rb(vec + 1) << 8);
          this.cyc += 7;
        }

        br(cond) {
          const o = this.fetchS();
          if (cond) {
            this.pc = (this.pc + o) & 0xffff;
            this.cyc++;
          }
        }

        step() {
          // IRQ check
          if (!this.fI()) {
            const pend = this.bus.irqStatus & ~this.bus.irqMask;
            if (pend & 2) {
              this.bus.irqStatus &= ~2;
              this._irq(0xfff8);
              return;
            } // IRQ1
            if (pend & 4) {
              this.bus.irqStatus &= ~4;
              this._irq(0xfffa);
              return;
            } // Timer
            if (pend & 1) {
              this.bus.irqStatus &= ~1;
              this._irq(0xfff6);
              return;
            } // IRQ2
          }

          const op = this.fetch();
          let a, v, t;

          switch (op) {
            // ADC
            case 0x69:
              this._adc(this.fetch());
              this.cyc += 2;
              break;
            case 0x65:
              this._adc(this.rb(this.zpR()));
              this.cyc += 3;
              break;
            case 0x75:
              this._adc(this.rb(this.zpXR()));
              this.cyc += 4;
              break;
            case 0x6d:
              this._adc(this.rb(this.absR()));
              this.cyc += 4;
              break;
            case 0x7d:
              this._adc(this.rb(this.abXR()));
              this.cyc += 4;
              break;
            case 0x79:
              this._adc(this.rb(this.abYR()));
              this.cyc += 4;
              break;
            case 0x61:
              this._adc(this.rb(this.izxR()));
              this.cyc += 6;
              break;
            case 0x71:
              this._adc(this.rb(this.izyR()));
              this.cyc += 5;
              break;
            // AND
            case 0x29:
              this.a = this.nz(this.a & this.fetch());
              this.cyc += 2;
              break;
            case 0x25:
              this.a = this.nz(this.a & this.rb(this.zpR()));
              this.cyc += 3;
              break;
            case 0x35:
              this.a = this.nz(this.a & this.rb(this.zpXR()));
              this.cyc += 4;
              break;
            case 0x2d:
              this.a = this.nz(this.a & this.rb(this.absR()));
              this.cyc += 4;
              break;
            case 0x3d:
              this.a = this.nz(this.a & this.rb(this.abXR()));
              this.cyc += 4;
              break;
            case 0x39:
              this.a = this.nz(this.a & this.rb(this.abYR()));
              this.cyc += 4;
              break;
            case 0x21:
              this.a = this.nz(this.a & this.rb(this.izxR()));
              this.cyc += 6;
              break;
            case 0x31:
              this.a = this.nz(this.a & this.rb(this.izyR()));
              this.cyc += 5;
              break;
            // ASL
            case 0x0a:
              this.a = this._asl(this.a);
              this.cyc += 2;
              break;
            case 0x06:
              a = this.zpR();
              this.wb(a, this._asl(this.rb(a)));
              this.cyc += 5;
              break;
            case 0x16:
              a = this.zpXR();
              this.wb(a, this._asl(this.rb(a)));
              this.cyc += 6;
              break;
            case 0x0e:
              a = this.absR();
              this.wb(a, this._asl(this.rb(a)));
              this.cyc += 6;
              break;
            case 0x1e:
              a = this.abXR();
              this.wb(a, this._asl(this.rb(a)));
              this.cyc += 7;
              break;
            // Branches
            case 0x90:
              this.br(!this.fC());
              this.cyc += 2;
              break;
            case 0xb0:
              this.br(this.fC());
              this.cyc += 2;
              break;
            case 0xf0:
              this.br(this.fZ());
              this.cyc += 2;
              break;
            case 0x30:
              this.br(this.fN());
              this.cyc += 2;
              break;
            case 0xd0:
              this.br(!this.fZ());
              this.cyc += 2;
              break;
            case 0x10:
              this.br(!this.fN());
              this.cyc += 2;
              break;
            case 0x50:
              this.br(!this.fV());
              this.cyc += 2;
              break;
            case 0x70:
              this.br(this.fV());
              this.cyc += 2;
              break;
            case 0x80:
              this.br(true);
              this.cyc += 4;
              break; // BRA
            // BIT
            case 0x24:
              this._bit(this.rb(this.zpR()));
              this.cyc += 3;
              break;
            case 0x2c:
              this._bit(this.rb(this.absR()));
              this.cyc += 4;
              break;
            case 0x34:
              this._bit(this.rb(this.zpXR()));
              this.cyc += 4;
              break;
            case 0x3c:
              this._bit(this.rb(this.abXR()));
              this.cyc += 4;
              break;
            case 0x89:
              this.sf(this.Z, (this.a & this.fetch()) === 0);
              this.cyc += 2;
              break;
            // BRK
            case 0x00: {
              this.pc = (this.pc + 1) & 0xffff;
              this.push((this.pc >> 8) & 0xff);
              this.push(this.pc & 0xff);
              this.push(this.p | this.B);
              this.sf(this.I, true);
              this.sf(this.T, false);
              this.pc = this.rb(0xfff6) | (this.rb(0xfff7) << 8);
              this.cyc += 7;
              break;
            }
            // Clear flags
            case 0x18:
              this.sf(this.C, false);
              this.cyc += 2;
              break;
            case 0xd8:
              this.sf(this.D, false);
              this.cyc += 2;
              break;
            case 0x58:
              this.sf(this.I, false);
              this.cyc += 2;
              break;
            case 0xb8:
              this.sf(this.V, false);
              this.cyc += 2;
              break;

            case 0xc9:
              this._cmp(this.a, this.fetch());
              this.cyc += 2;
              break;
            case 0xc5:
              this._cmp(this.a, this.rb(this.zpR()));
              this.cyc += 3;
              break;
            case 0xd5:
              this._cmp(this.a, this.rb(this.zpXR()));
              this.cyc += 4;
              break;
            case 0xcd:
              this._cmp(this.a, this.rb(this.absR()));
              this.cyc += 4;
              break;
            case 0xdd:
              this._cmp(this.a, this.rb(this.abXR()));
              this.cyc += 4;
              break;
            case 0xd9:
              this._cmp(this.a, this.rb(this.abYR()));
              this.cyc += 4;
              break;
            case 0xc1:
              this._cmp(this.a, this.rb(this.izxR()));
              this.cyc += 6;
              break;
            case 0xd1:
              this._cmp(this.a, this.rb(this.izyR()));
              this.cyc += 5;
              break;
            // CPX
            case 0xe0:
              this._cmp(this.x, this.fetch());
              this.cyc += 2;
              break;
            case 0xe4:
              this._cmp(this.x, this.rb(this.zpR()));
              this.cyc += 3;
              break;
            case 0xec:
              this._cmp(this.x, this.rb(this.absR()));
              this.cyc += 4;
              break;

            case 0xc0:
              this._cmp(this.y, this.fetch());
              this.cyc += 2;
              break;
            case 0xc4:
              this._cmp(this.y, this.rb(this.zpR()));
              this.cyc += 3;
              break;
            case 0xcc:
              this._cmp(this.y, this.rb(this.absR()));
              this.cyc += 4;
              break;

            case 0x3a:

              this.cyc += 2;
              break;
            case 0xc6:
              a = this.zpR();
              v = (this.rb(a) - 1) & 0xff;
              this.wb(a, this.nz(v));
              this.cyc += 5;
              break;
            case 0xd6:
              a = this.zpXR();
              v = (this.rb(a) - 1) & 0xff;
              this.wb(a, this.nz(v));
              this.cyc += 6;
              break;
            case 0xce:
              a = this.absR();
              v = (this.rb(a) - 1) & 0xff;
              this.wb(a, this.nz(v));
              this.cyc += 6;
              break;
            case 0xde:
              a = this.abXR();
              v = (this.rb(a) - 1) & 0xff;
              this.wb(a, this.nz(v));
              this.cyc += 7;
              break;
            case 0xca:
              this.x = this.nz((this.x - 1) & 0xff);
              this.cyc += 2;
              break;
            case 0x88:
              this.y = this.nz((this.y - 1) & 0xff);
              this.cyc += 2;
              break;
            // EOR
            case 0x49:
              this.a = this.nz(this.a ^ this.fetch());
              this.cyc += 2;
              break;
            case 0x45:
              this.a = this.nz(this.a ^ this.rb(this.zpR()));
              this.cyc += 3;
              break;
            case 0x55:
              this.a = this.nz(this.a ^ this.rb(this.zpXR()));
              this.cyc += 4;
              break;
            case 0x4d:
              this.a = this.nz(this.a ^ this.rb(this.absR()));
              this.cyc += 4;
              break;
            case 0x5d:
              this.a = this.nz(this.a ^ this.rb(this.abXR()));
              this.cyc += 4;
              break;
            case 0x59:
              this.a = this.nz(this.a ^ this.rb(this.abYR()));
              this.cyc += 4;
              break;
            case 0x41:
              this.a = this.nz(this.a ^ this.rb(this.izxR()));
              this.cyc += 6;
              break;
            case 0x51:
              this.a = this.nz(this.a ^ this.rb(this.izyR()));
              this.cyc += 5;
              break;
            // INC
            case 0x1a:
              this.a = this.nz((this.a + 1) & 0xff);
              this.cyc += 2;
              break;
            case 0xe6:
              a = this.zpR();
              v = (this.rb(a) + 1) & 0xff;
              this.wb(a, this.nz(v));
              this.cyc += 5;
              break;
            case 0xf6:
              a = this.zpXR();
              v = (this.rb(a) + 1) & 0xff;
              this.wb(a, this.nz(v));
              this.cyc += 6;
              break;
            case 0xee:
              a = this.absR();
              v = (this.rb(a) + 1) & 0xff;
              this.wb(a, this.nz(v));
              this.cyc += 6;
              break;
            case 0xfe:
              a = this.abXR();
              v = (this.rb(a) + 1) & 0xff;
              this.wb(a, this.nz(v));
              this.cyc += 7;
              break;
            case 0xe8:
              this.x = this.nz((this.x + 1) & 0xff);
              this.cyc += 2;
              break;
            case 0xc8:
              this.y = this.nz((this.y + 1) & 0xff);
              this.cyc += 2;
              break;

            case 0x4c:
              this.pc = this.absR();
              this.cyc += 3;
              break;
            case 0x6c:
              this.pc = this.indR();
              this.cyc += 6;
              break;
            case 0x7c:
              this.pc = this.inXR();
              this.cyc += 6;
              break;

            case 0x20: {
              a = this.absR();
              const ret = (this.pc - 1) & 0xffff;
              this.push((ret >> 8) & 0xff);
              this.push(ret & 0xff);
              this.pc = a;
              this.cyc += 6;
              break;

            case 0xa9:
              this.a = this.nz(this.fetch());
              this.cyc += 2;
              break;
            case 0xa5:
              this.a = this.nz(this.rb(this.zpR()));
              this.cyc += 3;
              break;
            case 0xb5:
              this.a = this.nz(this.rb(this.zpXR()));
              this.cyc += 4;
              break;
            case 0xad:
              this.a = this.nz(this.rb(this.absR()));
              this.cyc += 4;
              break;
            case 0xbd:
              this.a = this.nz(this.rb(this.abXR()));
              this.cyc += 4;
              break;
            case 0xb9:
              this.a = this.nz(this.rb(this.abYR()));
              this.cyc += 4;
              break;
            case 0xa1:
              this.a = this.nz(this.rb(this.izxR()));
              this.cyc += 6;
              break;
            case 0xb1:
              this.a = this.nz(this.rb(this.izyR()));
              this.cyc += 5;
              break;
            // LDX
            case 0xa2:
              this.x = this.nz(this.fetch());
              this.cyc += 2;
              break;
            case 0xa6:
              this.x = this.nz(this.rb(this.zpR()));
              this.cyc += 3;
              break;
            case 0xb6:
              this.x = this.nz(this.rb(this.zpYR()));
              this.cyc += 4;
              break;
            case 0xae:
              this.x = this.nz(this.rb(this.absR()));
              this.cyc += 4;
              break;
            case 0xbe:
              this.x = this.nz(this.rb(this.abYR()));
              this.cyc += 4;
              break;
            // LDY
            case 0xa0:
              this.y = this.nz(this.fetch());
              this.cyc += 2;
              break;
            case 0xa4:
              this.y = this.nz(this.rb(this.zpR()));
              this.cyc += 3;
              break;
            case 0xb4:
              this.y = this.nz(this.rb(this.zpXR()));
              this.cyc += 4;
              break;
            case 0xac:
              this.y = this.nz(this.rb(this.absR()));
              this.cyc += 4;
              break;
            case 0xbc:
              this.y = this.nz(this.rb(this.abXR()));
              this.cyc += 4;
              break;
            // LSR
            case 0x4a:
              this.a = this._lsr(this.a);
              this.cyc += 2;
              break;
            case 0x46:
              a = this.zpR();
              this.wb(a, this._lsr(this.rb(a)));
              this.cyc += 5;
              break;
            case 0x56:
              a = this.zpXR();
              this.wb(a, this._lsr(this.rb(a)));
              this.cyc += 6;
              break;
            case 0x4e:
              a = this.absR();
              this.wb(a, this._lsr(this.rb(a)));
              this.cyc += 6;
              break;
            case 0x5e:
              a = this.abXR();
              this.wb(a, this._lsr(this.rb(a)));
              this.cyc += 7;
              break;

            case 0xea:
              this.cyc += 2;
              break;
            // ORA
            case 0x09:
              this.a = this.nz(this.a | this.fetch());
              this.cyc += 2;
              break;
            case 0x05:
              this.a = this.nz(this.a | this.rb(this.zpR()));
              this.cyc += 3;
              break;
            case 0x15:
              this.a = this.nz(this.a | this.rb(this.zpXR()));
              this.cyc += 4;
              break;
            case 0x0d:
              this.a = this.nz(this.a | this.rb(this.absR()));
              this.cyc += 4;
              break;
            case 0x1d:
              this.a = this.nz(this.a | this.rb(this.abXR()));
              this.cyc += 4;
              break;
            case 0x19:
              this.a = this.nz(this.a | this.rb(this.abYR()));
              this.cyc += 4;
              break;
            case 0x01:
              this.a = this.nz(this.a | this.rb(this.izxR()));
              this.cyc += 6;
              break;
            case 0x11:
              this.a = this.nz(this.a | this.rb(this.izyR()));
              this.cyc += 5;
              break;

            case 0x48:
              this.push(this.a);
              this.cyc += 3;
              break;
            case 0x08:
              this.push(this.p | this.B);
              this.cyc += 3;
              break;
            case 0xda:
              this.push(this.x);
              this.cyc += 3;
              break;
            case 0x5a:
              this.push(this.y);
              this.cyc += 3;
              break;
            case 0x68:

              this.cyc += 4;

            case 0x28:

              this.cyc += 4;
              break;
            case 0xfa:
              this.x = this.nz(this.pop());
              this.cyc += 4;
              break;
            case 0x7a:
              this.y = this.nz(this.pop());
              this.cyc += 4;
              break;
            // ROL
            case 0x2a:
              this.a = this._rol(this.a);
              this.cyc += 2;
              break;
            case 0x26:
              a = this.zpR();
              this.wb(a, this._rol(this.rb(a)));
              this.cyc += 5;
              break;
            case 0x36:
              a = this.zpXR();
              this.wb(a, this._rol(this.rb(a)));
              this.cyc += 6;
              break;
            case 0x2e:
              a = this.absR();
              this.wb(a, this._rol(this.rb(a)));
              this.cyc += 6;
              break;
            case 0x3e:
              a = this.abXR();
              this.wb(a, this._rol(this.rb(a)));
              this.cyc += 7;
              break;
            // ROR
            case 0x6a:
              this.a = this._ror(this.a);
              this.cyc += 2;
              break;
            case 0x66:
              a = this.zpR();
              this.wb(a, this._ror(this.rb(a)));
              this.cyc += 5;
              break;
            case 0x76:
              a = this.zpXR();
              this.wb(a, this._ror(this.rb(a)));
              this.cyc += 6;
              break;
            case 0x6e:
              a = this.absR();
              this.wb(a, this._ror(this.rb(a)));
              this.cyc += 6;
              break;
            case 0x7e:
              a = this.abXR();
              this.wb(a, this._ror(this.rb(a)));
              this.cyc += 7;
              break;

            case 0x40: {
              this.p = (this.pop() & 0xef) | 0x20;
              const l2 = this.pop();
              const h2 = this.pop();
              this.pc = (h2 << 8) | l2;
              this.cyc += 6;
              break;
            }
            // RTS
            case 0x60: {
              const l3 = this.pop();
              const h3 = this.pop();
              this.pc = ((h3 << 8) | (l3 + 1)) & 0xffff;
              this.cyc += 6;
              break;
            }
            // SBC
            case 0xe9:
              this._sbc(this.fetch());
              this.cyc += 2;
              break;
            case 0xe5:
              this._sbc(this.rb(this.zpR()));
              this.cyc += 3;
              break;
            case 0xf5:
              this._sbc(this.rb(this.zpXR()));
              this.cyc += 4;
              break;
            case 0xed:
              this._sbc(this.rb(this.absR()));
              this.cyc += 4;
              break;
            case 0xfd:
              this._sbc(this.rb(this.abXR()));
              this.cyc += 4;
              break;
            case 0xf9:
              this._sbc(this.rb(this.abYR()));
              this.cyc += 4;
              break;
            case 0xe1:
              this._sbc(this.rb(this.izxR()));
              this.cyc += 6;
              break;
            case 0xf1:
              this._sbc(this.rb(this.izyR()));
              this.cyc += 5;
              break;
            // Set flags
            case 0x38:
              this.sf(this.C, true);
              this.cyc += 2;
              break;
            case 0xf8:
              this.sf(this.D, true);
              this.cyc += 2;
              break;
            case 0x78:
              this.sf(this.I, true);
              this.cyc += 2;
              break;
            // STA
            case 0x85:
              this.wb(this.zpR(), this.a);
              this.cyc += 3;
              break;
            case 0x95:
              this.wb(this.zpXR(), this.a);
              this.cyc += 4;
              break;
            case 0x8d:
              this.wb(this.absR(), this.a);
              this.cyc += 4;
              break;
            case 0x9d:
              this.wb(this.abXR(), this.a);
              this.cyc += 5;
              break;
            case 0x99:
              this.wb(this.abYR(), this.a);
              this.cyc += 5;
              break;
            case 0x81:
              this.wb(this.izxR(), this.a);
              this.cyc += 6;
              break;
            case 0x91:
              this.wb(this.izyR(), this.a);
              this.cyc += 6;
              break;
            // STX
            case 0x86:
              this.wb(this.zpR(), this.x);
              this.cyc += 3;
              break;
            case 0x96:
              this.wb(this.zpYR(), this.x);
              this.cyc += 4;
              break;
            case 0x8e:
              this.wb(this.absR(), this.x);
              this.cyc += 4;
              break;
            // STY
            case 0x84:
              this.wb(this.zpR(), this.y);
              this.cyc += 3;
              break;
            case 0x94:
              this.wb(this.zpXR(), this.y);
              this.cyc += 4;
              break;
            case 0x8c:
              this.wb(this.absR(), this.y);
              this.cyc += 4;
              break;
            // STZ
            case 0x64:
              this.wb(this.zpR(), 0);
              this.cyc += 3;
              break;
            case 0x74:
              this.wb(this.zpXR(), 0);
              this.cyc += 4;
              break;
            case 0x9c:
              this.wb(this.absR(), 0);
              this.cyc += 4;
              break;
            case 0x9e:
              this.wb(this.abXR(), 0);
              this.cyc += 5;
              break;
            // Transfers
            case 0xaa:
              this.x = this.nz(this.a);
              this.cyc += 2;
              break;
            case 0xa8:
              this.y = this.nz(this.a);
              this.cyc += 2;
              break;
            case 0xba:
              this.x = this.nz(this.sp);
              this.cyc += 2;
              break;
            case 0x8a:
              this.a = this.nz(this.x);
              this.cyc += 2;
              break;
            case 0x9a:
              this.sp = this.x;
              this.cyc += 2;
              break;
            case 0x98:
              this.a = this.nz(this.y);
              this.cyc += 2;
              break;
            // TRB / TSB
            case 0x04:
              a = this.zpR();
              v = this.rb(a);
              this.sf(this.Z, (this.a & v) === 0);
              this.wb(a, v & ~this.a);
              this.cyc += 5;
              break;
            case 0x14:
              a = this.zpR();
              v = this.rb(a);
              this.sf(this.Z, (this.a & v) === 0);
              this.wb(a, v | this.a);
              this.cyc += 5;
              break;
            case 0x0c:
              a = this.absR();
              v = this.rb(a);
              this.sf(this.Z, (this.a & v) === 0);
              this.wb(a, v & ~this.a);
              this.cyc += 6;
              break;
            case 0x1c:
              a = this.absR();
              v = this.rb(a);
              this.sf(this.Z, (this.a & v) === 0);
              this.wb(a, v | this.a);
              this.cyc += 6;
              break;
            // HuC6280 register swaps
            case 0x02:
              t = this.x;
              this.x = this.y;
              this.y = t;
              this.cyc += 3;
              break; // SXY
            case 0x22:
              t = this.a;
              this.a = this.x;
              this.x = t;
              this.cyc += 3;
              break; // SAX
            case 0x62:
              t = this.a;
              this.a = this.y;
              this.y = t;
              this.cyc += 3;
              break; // SAY
            case 0x9b:
              this.sp = this.y;
              this.cyc += 2;
              break; // TYS
            case 0xbb:
              this.y = this.nz(this.sp);
              this.cyc += 2;
              break; // TSY
            case 0xd4:
            case 0x54:
              this.cyc += 3;
              break; // CSH/CSL
            // ST0/ST1/ST2  (direct VDC port writes)
            case 0x03:
              this.bus.st0(this.fetch());
              this.cyc += 4;
              break;
            case 0x13:
              this.bus.st1(this.fetch());
              this.cyc += 4;
              break;
            case 0x23:
              this.bus.st2(this.fetch());
              this.cyc += 4;
              break;
            // TAM/TMA  (MPR mapping)
            case 0x53: {
              const m = this.fetch();
              for (let i = 0; i < 8; i++)
                if (m & (1 << i)) this.bus.mpr[i] = this.a;
              this.cyc += 5;
              break;
            }
            case 0x43: {
              const m = this.fetch();
              for (let i = 0; i < 8; i++)
                if (m & (1 << i)) {
                  this.a = this.bus.mpr[i];
                  break;
                }
              this.nz(this.a);
              this.cyc += 4;
              break;
            }
            // Block transfers
            case 0x73: {
              let s = this.fetch16(),
                d = this.fetch16(),
                n = this.fetch16();
              if (!n) n = 0x10000;
              while (n--) {
                this.wb(d, this.rb(s));
                s = (s + 1) & 0xffff;
                d = (d + 1) & 0xffff;
              }
              this.cyc += 17;
              break;
            } // TII
            case 0x63: {
              let s = this.fetch16(),
                d = this.fetch16(),
                n = this.fetch16();
              if (!n) n = 0x10000;
              while (n--) {
                this.wb(d, this.rb(s));
                s = (s - 1) & 0xffff;
                d = (d - 1) & 0xffff;
              }
              this.cyc += 17;
              break;
            } // TDD
            case 0x93: {
              let s = this.fetch16(),
                d = this.fetch16(),
                n = this.fetch16(),
                alt = 0;
              if (!n) n = 0x10000;
              while (n--) {
                this.wb(d + alt, this.rb(s));
                s = (s + 1) & 0xffff;
                alt ^= 1;
              }
              this.cyc += 17;
              break;
            } // TIA
            case 0xa3: {
              let s = this.fetch16(),
                d = this.fetch16(),
                n = this.fetch16(),
                alt = 0;
              if (!n) n = 0x10000;
              while (n--) {
                this.wb(d, this.rb(s + alt));
                d = (d + 1) & 0xffff;
                alt ^= 1;
              }
              this.cyc += 17;
              break;
            } // TAI
            case 0xe3: {
              let s = this.fetch16(),
                d = this.fetch16(),
                n = this.fetch16();
              if (!n) n = 0x10000;
              while (n--) {
                this.wb(d, this.rb(s));
                s = (s + 1) & 0xffff;
              }
              this.cyc += 17;
              break;
            } // TIN
            // BBR0–BBR7
            case 0x0f:
            case 0x1f:
            case 0x2f:
            case 0x3f:
            case 0x4f:
            case 0x5f:
            case 0x6f:
            case 0x7f: {
              const bt = (op >> 4) & 7;
              a = this.fetch();
              const r = this.fetchS();
              if (!((this.rb(a) >> bt) & 1)) this.pc = (this.pc + r) & 0xffff;
              this.cyc += 6;
              break;
            }
            // BBS0–BBS7
            case 0x8f:
            case 0x9f:
            case 0xaf:
            case 0xbf:
            case 0xcf:
            case 0xdf:
            case 0xef:
            case 0xff: {
              const bt = (op >> 4) & 7;
              a = this.fetch();
              const r = this.fetchS();
              if ((this.rb(a) >> bt) & 1) this.pc = (this.pc + r) & 0xffff;
              this.cyc += 6;
              break;
            }
            // RMB0–RMB7
            case 0x07:
            case 0x17:
            case 0x27:
            case 0x37:
            case 0x47:
            case 0x57:
            case 0x67:
            case 0x77: {
              const bt = (op >> 4) & 7;
              a = this.fetch();
              this.wb(a, this.rb(a) & ~(1 << bt));
              this.cyc += 5;
              break;
            }
            // SMB0–SMB7
            case 0x87:
            case 0x97:
            case 0xa7:
            case 0xb7:
            case 0xc7:
            case 0xd7:
            case 0xe7:
            case 0xf7: {
              const bt = (op >> 4) & 7;
              a = this.fetch();
              this.wb(a, this.rb(a) | (1 << bt));
              this.cyc += 5;
              break;
            }
            // BSR  (branch to subroutine, relative)
            case 0x32: {
              const off = this.fetchS();
              const ret = (this.pc - 1) & 0xffff;
              this.push((ret >> 8) & 0xff);
              this.push(ret & 0xff);
              this.pc = (this.pc + off) & 0xffff;
              this.cyc += 8;
              break;
            }
            // Unknown → NOP
            default:
              this.cyc += 2;
              break;
          }
        }
      }

      // ════════════════════════════════════════════════════════
      // MAIN
      // ════════════════════════════════════════════════════════
      const canvas = document.getElementById("screen");
      const ctx2d = canvas.getContext("2d");
      const imgData = ctx2d.createImageData(256, 240);
      const pcEl = document.getElementById("pc");
      const statusEl = document.getElementById("status");
      const fpsEl = document.getElementById("fps");
      const fileEl = document.getElementById("file-name");

      let cpu, bus, vdc, vce, psg, joy;
      let running = false,
        rafId = null;

      // Keyboard
      const KM = {
        ArrowUp: BTN_UP,
        ArrowDown: BTN_DOWN,
        ArrowLeft: BTN_LEFT,
        ArrowRight: BTN_RIGHT,
        z: BTN_I,
        Z: BTN_I,
        x: BTN_II,
        X: BTN_II,
        " ": BTN_II,
        Enter: BTN_RUN,
        Shift: BTN_SEL,
        RightShift: BTN_SEL,
      };
      window.addEventListener("keydown", (e) => {
        if (!joy) return;
        const b = KM[e.key];
        if (b !== undefined) {
          joy.press(b);
          e.preventDefault();
        }
      });
      window.addEventListener("keyup", (e) => {
        if (!joy) return;
        const b = KM[e.key];
        if (b !== undefined) joy.release(b);
      });

      // File
      document.getElementById("rom").addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;
        fileEl.textContent = file.name;
        statusEl.textContent = "Loading...";
        running = false;
        if (rafId) {
          cancelAnimationFrame(rafId);
          rafId = null;
        }

        const reader = new FileReader();
        reader.onload = () => {
          const rom = loadPCE(reader.result);
          const nBanks = Math.ceil(rom.length / 0x2000);

          vce = new VCE();
          vdc = new VDC(vce);
          psg = new PSG();
          joy = new Joypad();
          bus = new Bus(rom, vdc, vce, psg, joy);
          cpu = new CPU(bus);

          // MPR setup
          bus.mpr.set([
            0xff, // page 0: $0000–$1FFF → I/O
            0xf8, // page 1: $2000–$3FFF → RAM
            0x00 % nBanks, // page 2: $4000–$5FFF
            0x01 % nBanks, // page 3
            0x02 % nBanks, // page 4
            0x03 % nBanks, // page 5
            0x04 % nBanks, // page 6
            nBanks - 1, // page 7: $E000–$FFFF → last ROM bank (reset vectors)
          ]);

for (let i = 0; i < 8; i++) {
  bus.mpr[i] = i < nBanks ? i : 0;
}
          cpu.reset();
          document.getElementById("start").textContent = "Start";
          statusEl.textContent = "ROM Loaded – Press Start";
        };
        reader.readAsArrayBuffer(file);
      });

      // Start/Pause
      document.getElementById("start").addEventListener("click", () => {
        if (!bus) {
          alert("Please load a ROM first.");
          return;
        }
        if (running) {
          running = false;
          if (rafId) {
            cancelAnimationFrame(rafId);
            rafId = null;
          }
          statusEl.textContent = "Paused";
          document.getElementById("start").textContent = "Start";
        } else {
          running = true;
          statusEl.textContent = "Running";
          document.getElementById("start").textContent = "Pause";
          loop();
        }
      });

      // Fullscreen
      document.getElementById("fullscreenBtn").addEventListener("click", () => {
        if (!document.fullscreenElement) canvas.requestFullscreen();
        else document.exitFullscreen();
      });

      // ── Game loop ────────────────────────────────────────────
      const CYCLES_PER_FRAME = 119318; // 7.159090 MHz / 60 fps

      let fpsFrames = 0,
        fpsAcc = 0,
        lastTs = 0;

      function loop() {
        function frame(ts) {
          if (!running) return;
          rafId = requestAnimationFrame(frame);

          const dt = ts - lastTs;
          lastTs = ts;
          fpsAcc += dt;
          fpsFrames++;
          if (fpsAcc >= 1000) {
            fpsEl.textContent = fpsFrames;
            fpsFrames = 0;
            fpsAcc -= 1000;
          }

          const target = cpu.cyc + CYCLES_PER_FRAME;
          try {
            while (cpu.cyc < target) {
              const before = cpu.cyc;
              cpu.step();
              const elapsed = Math.max(1, (cpu.cyc - before) & 0x7fffffff);

              const vf = vdc.tick(elapsed);
              if (vf && !(bus.irqMask & 2)) bus.irqStatus |= 2;

              bus.tickTimer(elapsed);
            }
          } catch (err) {
            running = false;
            statusEl.textContent = "Error: " + err.message;
            document.getElementById("start").textContent = "Start";
            console.error(err);
            return;
          }
console.log(vdc.vram);
          vdc.flush(imgData);
          ctx2d.putImageData(imgData, 0, 0);
          pcEl.textContent = "0x" + h16(cpu.pc);
        }
        lastTs = performance.now();
        rafId = requestAnimationFrame(frame);
      }
    </script>
  </body>
</html>
